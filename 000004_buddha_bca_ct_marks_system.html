<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width,initial-scale=1.0">
<title>Buddha Bca Ct Marks System</title>
<style>
body{
background-color:#0b2226;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}
.card{
background-color:#1e242b;
padding:25px;
border-radius:8px;
width:450px;
box-shadow:0 4px 15pxrgba(0,0,0,0.5);
color:#fff;
position:relative;
}
.logo{
position:absolute;
top:20px;
right:20px;
width:105px;
height:105px;
}
.title{
color:#00d2d3;
font-size:16px;
margin-bottom:25px;
margin-right:115px;
letter-spacing:1px;
line-height:1.3;
}
.input-group{
margin-bottom:15px;
}
.input-group label{
display:block;
font-size:14px;
margin-bottom:5px;
color:#00d2d3;
}
.input-group input{
width:100%;
padding:8px 0;
background:transparent;
border:none;
border-bottom:2px solid#555;
color:#fff;
font-size:16px;
outline:none;
}
.input-group input::-webkit-outer-spin-button,
.input-group input::-webkit-inner-spin-button{
-webkit-appearance:none;
margin:0;
}
.input-group input[type=number]{
-moz-appearance:textfield;
}
.input-group input:focus{
border-bottom-color:#00d2d3;
}
button{
width:100%;
padding:10px;
background-color:transparent;
border:2px solid#00d2d3;
color:#00d2d3;
font-weight:bold;
cursor:pointer;
margin-top:15px;
transition:0.3s;
border-radius:4px;
}
button:hover{
background-color:#00d2d3;
color:#1e242b;
}
#showData{
margin-top:20px;
font-size:14px;
line-height:1.8;
color:#fff;
background:#14191f;
padding:15px;
border-radius:6px;
display:none;
}
.result-item{
display:flex;
justify-content:space-between;
margin-bottom:5px;
border-bottom:1px solid#2a343d;
padding-bottom:4px;
}
</style>
</head>
<body>
<div class="card">
<!--Properly Fitted Logo at Top-Right Corner-->
<div class="logo">
<svg viewBox="0 0 200 200"width="100%"height="100%">
<defs>
<path id="textPathTop"d="M 38,100 A 62,62 0 1,1 162,100"fill="none"/>
</defs>
<!--Outer Gear background-->
<g fill="#f4511e">
<circle cx="100"cy="100"r="82"/>
<rect x="92"y="10"width="16"height="15"rx="3"/>
<rect x="92"y="175"width="16"height="15"rx="3"/>
<rect x="10"y="92"width="15"height="16"rx="3"/>
<rect x="175"y="92"width="15"height="16"rx="3"/>
<rect x="30"y="30"width="15"height="16"rx="3"transform="rotate(45 37 38)"/>
<rect x="155"y="30"width="15"height="16"rx="3"transform="rotate(-45 162 38)"/>
<rect x="30"y="155"width="15"height="16"rx="3"transform="rotate(-45 37 162)"/>
<rect x="155"y="155"width="15"height="16"rx="3"transform="rotate(45 162 162)"/>
<rect x="17"y="55"width="15"height="16"rx="3"transform="rotate(20 24 63)"/>
<rect x="168"y="55"width="15"height="16"rx="3"transform="rotate(-20 175 63)"/>
<rect x="17"y="129"width="15"height="16"rx="3"transform="rotate(-20 24 137)"/>
<rect x="168"y="129"width="15"height="16"rx="3"transform="rotate(20 175 137)"/>
<rect x="55"y="17"width="16"height="15"rx="3"transform="rotate(70 63 24)"/>
<rect x="129"y="17"width="16"height="15"rx="3"transform="rotate(-70 137 24)"/>
<rect x="55"y="168"width="16"height="15"rx="3"transform="rotate(-70 63 175)"/>
<rect x="129"y="168"width="16"height="15"rx="3"transform="rotate(70 137 175)"/>
</g>
<!--White ring background-->
<circle cx="100"cy="100"r="70"fill="#ffffff"/>
<!--Inner light blue circle divided into 4 quadrants-->
<circle cx="100"cy="100"r="54"fill="#64b5f6"/>
<line x1="100"y1="46"x2="100"y2="154"stroke="#000000"stroke-width="1.5"/>
<line x1="46"y1="100"x2="154"y2="100"stroke="#000000"stroke-width="1.5"/>
<!--Top-Left Icon:Rocket-->
<g transform="translate(62,58)scale(0.6)">
<path d="M 25 5 L 35 35 L 25 30 L 15 35 Z"fill="#ffffff"stroke="#000000"stroke-width="2"/>
<circle cx="25"cy="18"r="3"fill="#ffeb3b"stroke="#000000"stroke-width="1"/>
<path d="M 12 30 L 15 35 L 12 40 Z"fill="#e53935"/>
<path d="M 38 30 L 35 35 L 38 40 Z"fill="#e53935"/>
<path d="M 21 30 L 25 42 L 29 30 Z"fill="#ff9800"/>
</g>
<!--Top-Right Icon:Microscope-->
<g transform="translate(116,62)scale(0.55)">
<path d="M 20 10 L 25 10 L 25 25 L 30 25" fill="none"stroke="#000000"stroke-width="3"/>
<circle cx="18"cy="10"r="6"fill="none"stroke="#000000"stroke-width="2.5"/>
<rect x="15"y="25"width="20"height="8"fill="#000000"/>
<path d="M 10 38 L 35 38"stroke="#000000"stroke-width="4"stroke-linecap="round"/>
</g>
<!--Bottom-Left Icon:Open Book-->
<g transform="translate(62,116)scale(0.6)">
<path d="M 5 15 Q 20 5 35 15 L 35 32 Q 20 22 5 32 Z"fill="#ffffff"stroke="#000000"stroke-width="2"/>
<path d="M 65 15 Q 50 5 35 15 L 35 32 Q 50 22 65 32 Z"fill="#ffffff"stroke="#000000"stroke-width="2"/>
<line x1="35"y1="15"x2="35"y2="32"stroke="#000000"stroke-width="2"/>
</g>
<!--Bottom-Right Icon:Laptop-->
<g transform="translate(116,118)scale(0.6)">
<rect x="8"y="8"width="24"height="16"rx="2"fill="#ffffff"stroke="#000000"stroke-width="2"/>
<polygon points="4,26 36,26 39,29 1,29"fill="#212121"/>
</g>
<!--Circular Text Path for BUDDHA DEGREE COLLEGE-->
<text font-family="Arial,sans-serif"font-weight="bold"font-size="11"fill="#000000"letter-spacing="0.8">
<textPath href="#textPathTop"startOffset="50%"text-anchor="middle">BUDDHA DEGREE COLLEGE</textPath>
</text>
<!--Bottom BDC Ribbon Banner-->
<g transform="translate(0,10)">
<polygon points="45,160 175,160 165,185 35,185"fill="#1a1a1a"/>
<polygon points="35,185 45,160 30,172"fill="#000000"/>
<polygon points="175,185 165,160 180,172"fill="#000000"/>
<rect x="55"y="163"width="90"height="20"fill="#f4511e"rx="2"/>
<text x="100"y="178"font-family="Arial,sans-serif"font-weight="bold"font-size="13"fill="#ffffff"text-anchor="middle"letter-spacing="1">BDC</text>
</g>
</svg>
</div>
<h1 class="title">Buddha Bca Ct Marks System</h1>
<div class="input-group">
<label for="sub1">Subject1(Max 25)</label>
<input type="number"id="sub1"placeholder="Enter marks">
</div>
<div class="input-group">
<label for="sub2">Subject 2(Max 25)</label>
<input type="number"id="sub2"placeholder="Enter marks">
</div>
<div class="input-group">
<label for="sub3">Subject 3(Max 25)</label>
<input type="number"id="sub3"placeholder="Enter marks">
</div>
<div class="input-group">
<label for="sub4">Subject 4(Max 25)</label>
<input type="number"id="sub4"placeholder="Enter marks">
</div>
<button onclick="calculateResult()">Show Result</button>
<div id="showData"></div>
</div>
<script>
function calculateResult(){
const s1=parseFloat(document.getElementById('sub1').value)||0;
const s2=parseFloat(document.getElementById('sub2').value)||0;
const s3=parseFloat(document.getElementById('sub3').value)||0;
const s4=parseFloat(document.getElementById('sub4').value)||0;
if(s1>25||s2>25||s3>25||s4>25||s1<0||s2<0||s3<0||s4<0){
return;
}
const totalMarks=s1+s2+s3+s4;
const percentage=totalMarks;
let status=totalMarks>=50?"PASS":"FAIL";
const showData=document.getElementById('showData');
showData.style.display="block";
showData.innerHTML=`
<div class="result-item"><span>Total Marks</span><strong>${totalMarks}/100</strong></div>
<div class="result-item"><span>Percentage</span><strong>${percentage}%</strong></div>
<div class="result-item"><span>Status</span><strong style="color:${status==='PASS'?'#00d2d3':'#ff5252'};">${status}</strong></div>
`;
}
</script>
</body>
</html>
